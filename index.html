<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora de Ciberseguridad — 0xBlackCanary</title>
<meta name="description" content="Artículos e investigaciones de ciberseguridad de 0xBlackCanary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05090a;
    --panel:#0a1113;
    --line:#123a2c;
    --green:#00ff9c;
    --green-dim:#3f8f74;
    --text:#c9e8dd;
    --amber:#ffb545;
    --radius:2px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      linear-gradient(rgba(0,255,156,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,156,.035) 1px, transparent 1px);
    background-size:34px 34px;
    color:var(--text);
    font-family:"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
    font-size:15px;
    line-height:1.7;
  }
  .wrap{max-width:820px;margin:0 auto;padding:40px 20px 80px}
  a{color:var(--green);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2px solid var(--green);outline-offset:3px}

  header.top{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:34px}
  .prompt{color:var(--green-dim);font-size:13px;letter-spacing:.02em}
  .prompt b{color:var(--green);font-weight:500}
  h1{
    font-size:clamp(26px,6vw,40px);
    margin:12px 0 6px;
    color:var(--green);
    font-weight:700;
    letter-spacing:-.01em;
    text-shadow:0 0 18px rgba(0,255,156,.35);
  }
  .cursor{display:inline-block;width:.6em;height:1em;background:var(--green);vertical-align:-.12em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
  .tagline{color:var(--green-dim);font-size:14px;margin:0}
  nav.links{margin-top:16px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap}

  .count{color:var(--green-dim);font-size:13px;margin-bottom:14px}

  ul.posts{list-style:none;margin:0;padding:0}
  ul.posts li{margin-bottom:14px}
  .post{
    display:block;
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--green-dim);
    border-radius:var(--radius);
    padding:16px 18px;
    color:var(--text);
    cursor:pointer;
    width:100%;
    text-align:left;
    font:inherit;
    transition:border-color .15s, background .15s;
  }
  .post:hover,.post:focus-visible{border-left-color:var(--green);background:#0d1719;text-decoration:none}
  .post .date{color:var(--amber);font-size:12px}
  .post .title{display:block;color:var(--green);font-weight:500;font-size:16px;margin:4px 0 6px;line-height:1.45}
  .post .desc{font-size:13.5px;color:var(--text);opacity:.8;margin:0}

  /* Lector de artículo */
  #reader{display:none}
  #reader.on{display:block}
  #list.off{display:none}
  .back{
    background:none;border:1px solid var(--line);color:var(--green);
    font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:24px;
  }
  .back:hover{border-color:var(--green)}
  article h1,article h2,article h3{color:var(--green);line-height:1.35}
  article h1{font-size:26px;text-shadow:none;margin-top:0}
  article h2{font-size:20px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:38px}
  article h3{font-size:17px;margin-top:28px}
  article p,article li{font-size:14.5px}
  article code{background:#0d1719;border:1px solid var(--line);padding:1px 5px;border-radius:var(--radius);color:var(--amber);font-size:13px}
  article pre{background:#0a1113;border:1px solid var(--line);border-left:3px solid var(--green-dim);padding:14px;overflow-x:auto;border-radius:var(--radius)}
  article pre code{background:none;border:none;padding:0;color:var(--text)}
  article blockquote{border-left:3px solid var(--amber);margin:20px 0;padding:2px 16px;color:var(--green-dim)}
  article img{max-width:100%;height:auto}
  article table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}
  article th,article td{border:1px solid var(--line);padding:6px 10px;font-size:13.5px}
  article hr{border:none;border-top:1px solid var(--line);margin:32px 0}
  .status{color:var(--green-dim);font-size:13.5px}
  .status.err{color:var(--amber)}

  footer{border-top:1px solid var(--line);margin-top:54px;padding-top:18px;font-size:12.5px;color:var(--green-dim)}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="prompt">0xBlackCanary@bitacora:~$ <b>cat entradas/*.md</b><span class="cursor"></span></div>
    <h1>Bitácora de Ciberseguridad</h1>
    <p class="tagline">Notas, análisis y trastadas controladas mientras aprendo seguridad ofensiva y defensiva.</p>
    <nav class="links">
      <a href="https://github.com/0xBlackCanary">Perfil de GitHub</a>
      <a href="https://github.com/0xBlackCanary/blog">Repositorio del blog</a>
    </nav>
  </header>

  <main>
    <section id="list">
      <p class="count" id="count"></p>
      <ul class="posts" id="posts"></ul>
    </section>

    <section id="reader">
      <button class="back" id="back" type="button">&lt;&lt; volver al índice</button>
      <p class="status" id="status"></p>
      <article id="content"></article>
    </section>
  </main>

  <footer>
    Publicado con GitHub Pages · Los artículos viven en <a href="https://github.com/0xBlackCanary/blog">0xBlackCanary/blog</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
// ── Aquí se añaden los artículos nuevos: copia un bloque y cambia los datos ──
const POSTS = [
  {
    file: "2026-09-18-canary-tokens-trampas-defensivas.md",
    date: "18 Sep 2026",
    title: "Canary Tokens: El Arte del Engaño y la Detección Temprana en la Red",
    desc: "Señuelos que avisan en cuanto alguien toca lo que no debe."
  },
  {
    file: "2026-09-16-privacidad-eidas2-dni-ip.md",
    date: "16 Sep 2026",
    title: "Ciberseguridad y soberanía digital: el marco eIDAS2 en la UE",
    desc: "Qué cambia en identidad digital, DNI e IP para la ciudadanía europea."
  },
  {
    file: "2026-09-15-bastionado-iot-smart-tv.md",
    date: "15 Sep 2026",
    title: "Bastionado IoT: convertir tu Smart TV en un entorno Zero Trust",
    desc: "Segmentar, bloquear y vigilar el cacharro más indiscreto del salón."
  },
  {
    file: "2026-09-14-owasp-top10-sqli.md",
    date: "14 Sep 2026",
    title: "OWASP Top 10: rompiendo la lógica de las bases de datos con SQLi",
    desc: "Cómo se cuela una inyección SQL y cómo se cierra la puerta."
  },
  {
    file: "2026-09-14-cloudflare-lavarand.md",
    date: "14 Sep 2026",
    title: "El caos que protege la red: criptografía y las lámparas de lava de Cloudflare",
    desc: "De dónde sale la aleatoriedad que sostiene el cifrado."
  }
];

const REPO = "https://github.com/0xBlackCanary/blog/blob/main/";
const listEl = document.getElementById("list");
const postsEl = document.getElementById("posts");
const readerEl = document.getElementById("reader");
const contentEl = document.getElementById("content");
const statusEl = document.getElementById("status");

document.getElementById("count").textContent =
  POSTS.length + (POSTS.length === 1 ? " entrada publicada" : " entradas publicadas");

POSTS.forEach(p => {
  const li = document.createElement("li");
  const btn = document.createElement("button");
  btn.className = "post";
  btn.type = "button";
  btn.innerHTML =
    '<span class="date">' + p.date + '</span>' +
    '<span class="title">' + p.title + '</span>' +
    '<p class="desc">' + p.desc + '</p>';
  btn.addEventListener("click", () => { location.hash = "#/" + p.file; });
  li.appendChild(btn);
  postsEl.appendChild(li);
});

async function abrir(file) {
  const post = POSTS.find(p => p.file === file);
  listEl.classList.add("off");
  readerEl.classList.add("on");
  contentEl.innerHTML = "";
  statusEl.className = "status";
  statusEl.textContent = "Cargando " + file + " …";
  window.scrollTo(0, 0);
  try {
    const res = await fetch(file, { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    statusEl.textContent = "";
    contentEl.innerHTML = marked.parse(md);
    const link = document.createElement("p");
    link.innerHTML = '<a href="' + REPO + file + '">Ver este artículo en GitHub</a>';
    contentEl.appendChild(link);
    document.title = (post ? post.title : file) + " — 0xBlackCanary";
  } catch (e) {
    statusEl.className = "status err";
    statusEl.innerHTML = 'No se pudo cargar el archivo. Ábrelo en GitHub: <a href="' + REPO + file + '">' + file + '</a>';
  }
}

function indice() {
  readerEl.classList.remove("on");
  listEl.classList.remove("off");
  document.title = "Bitácora de Ciberseguridad — 0xBlackCanary";
  window.scrollTo(0, 0);
}

function ruta() {
  const h = decodeURIComponent(location.hash.replace(/^#\//, ""));
  if (h && /^[\w.\-]+\.md$/.test(h)) abrir(h);
  else indice();
}

document.getElementById("back").addEventListener("click", () => { location.hash = ""; });
window.addEventListener("hashchange", ruta);
ruta();
</script>
</body>
</html>
